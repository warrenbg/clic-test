<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎯 Clics par Seconde</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <meta name="theme-color" content="#5e72e4" />
</head>
<body>
  <h1>🎯 Clics par Seconde</h1>
  <p>Entre ton pseudonyme, choisis la durée et clique sur "Démarrer" !</p>

  <input type="text" id="pseudo" placeholder="Ton pseudo ici..." />
  <br />
  <label for="duration">Durée :</label>
  <select id="duration">
    <option value="5">5s</option>
    <option value="10">10s</option>
    <option value="15">15s</option>
  </select>
  <br />
  <button id="start">Démarrer</button>
  <button id="clickBtn" disabled>Clique ici !</button>

  <div id="compteur"></div>
  <div id="resultat"></div>
  <div id="classement"></div>

  <div id="topScores">
    <h2>🏆 Top 10 des scores</h2>
    <table id="scoreTable">
      <thead>
        <tr><th>Rang</th><th>Pseudo</th><th>Clics</th><th>CPS</th></tr>
      </thead>
      <tbody id="scoreBody"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
